name: Deploy to Vercel (manual, gated)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment (production requires explicit selection)'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: vercel-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 35
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d7bd72dd0e # v4.4.0
        with:
          node-version: '22'
      - name: Verify target configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo '::error::Missing VERCEL_TOKEN'; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo '::error::Missing VERCEL_ORG_ID'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo '::error::Missing VERCEL_PROJECT_ID'; exit 1; }
          test "${{ github.ref }}" = 'refs/heads/main' || { echo '::error::Only reviewed main may deploy'; exit 1; }
      - name: Install reviewed Vercel CLI
        run: npm install --global vercel@64.5.0
      - name: Pull configuration for selected environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ '${{ inputs.environment }}' = 'production' ]; then
            vercel pull --yes --environment=production
          else
            vercel pull --yes --environment=preview
          fi
      - name: Build in selected environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ '${{ inputs.environment }}' = 'production' ]; then
            vercel build --prod
          else
            vercel build
          fi
      - name: Deploy tested build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ '${{ inputs.environment }}' = 'production' ]; then
            vercel deploy --prebuilt --prod
          else
            vercel deploy --prebuilt
          fi

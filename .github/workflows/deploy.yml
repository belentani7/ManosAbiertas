name: Deploy to Netlify (manual, optional)

# The automated production path for this repository is not configured.
# Never run the deprecated npm-based Netlify deploy on every main commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: vars.ENABLE_NETLIFY_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - name: Validate Netlify credentials
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "::error::Netlify deployment is enabled but site/token credentials are missing."
            exit 1
          fi
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish Next.js via Netlify CLI
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@23.8.1 deploy --build --prod --site "$NETLIFY_SITE_ID"

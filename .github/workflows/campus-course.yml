name: Campus course delivery
on:
  pull_request:
    paths:
      - campus/**
      - tests/campus-*.test.mjs
      - tests/browser-campus.cjs
      - .github/workflows/campus-course.yml
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-courses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d7bd72dd0e # v4.4.0
        with:
          node-version: "22"
      - name: Syntax for browser modules
        run: |
          node --check campus/course-core.mjs
          node --check campus/course-viewer.mjs
          node --check campus/app.js
          node --check campus/sw.js
      - name: Course integrity and offline delivery tests
        run: node --test tests/campus-*.test.mjs
      - name: Prepare isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/campus-browser" --no-package-lock --ignore-scripts playwright@1.56.1
          node "$RUNNER_TEMP/campus-browser/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Mobile learning journey and complete offline course
        run: |
          python3 -m http.server 8766 --bind 127.0.0.1 --directory . > /tmp/manos-campus-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8766/campus/ > /dev/null; then break; fi
            sleep 1
          done
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/campus-browser/node_modules/playwright" node tests/browser-campus.cjs

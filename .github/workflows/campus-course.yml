name: Campus course delivery
on:
  pull_request:
    paths:
      - campus/**
      - tests/campus-*.test.mjs
      - .github/workflows/campus-course.yml
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-courses:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Syntax for browser modules
        run: |
          node --check campus/course-core.mjs
          node --check campus/course-viewer.mjs
          node --check campus/app.js
          node --check campus/sw.js
      - name: Course integrity and offline delivery tests
        run: node --test tests/campus-*.test.mjs

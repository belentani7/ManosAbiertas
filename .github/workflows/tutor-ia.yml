name: tutor-ia

on:
  schedule:
    - cron: "0 8 * * *"
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capsula:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: github.event_name != 'issues'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Capsula didactica del dia
        env:
          GH_TOKEN: ${{ github.token }}
        run: python campus/agente/tutor.py capsula

  tutor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Responder si tiene la etiqueta tutor
        env:
          GH_TOKEN: ${{ github.token }}
          ETIQUETAS: ${{ toJSON(github.event.issue.labels) }}
        run: |
          echo "$ETIQUETAS" | grep -qi "tutor" && python campus/agente/tutor.py issue || echo "sin etiqueta tutor"

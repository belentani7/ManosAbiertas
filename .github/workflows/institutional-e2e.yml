name: Institutional E2E

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/app/**'
      - 'src/components/manos-abiertas/**'
      - 'src/lib/**'
      - 'src/i18n/**'
      - 'public/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'campus/**'
      - 'scripts/publish-campus.mjs'
      - 'scripts/verify-production-routes.mjs'
      - '.github/workflows/institutional-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'src/app/**'
      - 'src/components/manos-abiertas/**'
      - 'src/lib/**'
      - 'src/i18n/**'
      - 'public/**'
      - 'e2e/**'
      - 'playwright.config.ts'
      - 'campus/**'
      - 'scripts/publish-campus.mjs'
      - 'scripts/verify-production-routes.mjs'
      - '.github/workflows/institutional-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.4.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser engines
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Publish the canonical campus for static browser verification
        run: node scripts/publish-campus.mjs
      - name: Test static institutional journeys on desktop and mobile
        run: pnpm exec playwright test
      - name: Preserve failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: institutional-playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

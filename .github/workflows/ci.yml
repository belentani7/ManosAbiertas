name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node.js build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Core tests
        run: npm run test:core

      - name: Internationalization checks
        run: npm run i18n:verify

      - name: Resource trust checks
        run: npm run trust:verify

      - name: Accessibility checks
        run: npm run accessibility:verify

      - name: Build
        run: npm run build

  python:
    name: Python build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint and syntax-check maintained Python
        run: |
          pip install flake8
          flake8 campus/agente campus/juegos --count --show-source --statistics --extend-ignore=E501

      - name: Build
        run: python -m compileall -q campus/agente campus/juegos

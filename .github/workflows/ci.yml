name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  education-contract:
    name: Validate education contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate the education contract itself
        run: node --test scripts/verify-education-contract.test.mjs
      - name: Validate current evidence ledger
        run: node scripts/verify-education-contract.mjs

  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.4.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma types
        run: pnpm exec prisma generate
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.4.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Core unit and security regression tests
        run: pnpm test:core
        env:
          CI: 'true'
      - name: Verify translated content
        run: pnpm i18n:verify
      - name: Verify resource claims
        run: pnpm trust:verify
      - name: Verify static accessibility
        run: pnpm accessibility:verify

  build:
    name: Build
    needs: [lint, test, education-contract]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: '10.4.1'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: Production build (do not hide errors)
        run: pnpm build

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Detect repository secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

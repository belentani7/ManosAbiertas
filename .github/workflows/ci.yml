name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  PNPM_VERSION: 10.4.1

jobs:
  lint:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Typecheck
        run: pnpm exec prisma generate && pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Verify implementation contracts
        run: pnpm improvements:verify

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Test
        run: pnpm test:core
        env:
          CI: true
      - name: Reject missing campus assets, invalid quiz JSON and stale quiz controls
        run: node --test tests/campus-navigation-integrity.test.mjs
      - name: Verify cybersecurity course content (smishing)
        run: node scripts/verify-ciberseguridad-smishing.mjs
      - name: Verify five generated learning courses' actual content
        run: node scripts/verify-generated-course-content.mjs
      - name: Verify translations
        run: pnpm i18n:verify
      - name: Verify resource trust
        run: pnpm trust:verify
      - name: Verify static accessibility
        run: pnpm accessibility:verify

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Build
        run: pnpm build
      - name: Smoke test the real Next.js production server and campus
        run: |
          set -euo pipefail
          PORT=3000 pnpm start > "$RUNNER_TEMP/manos-production-smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then ready=1; break; fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then cat "$RUNNER_TEMP/manos-production-smoke.log"; exit 1; fi
          if ! node scripts/verify-production-routes.mjs; then
            cat "$RUNNER_TEMP/manos-production-smoke.log"
            exit 1
          fi
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-standalone
          path: .next/standalone/
          if-no-files-found: error
          include-hidden-files: true

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Start server
        run: |
          PORT=3000 pnpm start > /tmp/manos-abiertas-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/manos-abiertas-server.log
          exit 1
      - name: Audit live Portuguese and Spanish homepages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/pt
            http://localhost:3000/es
          uploadArtifacts: true

  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    needs: build
    # The Vercel project must be explicitly connected and credentials configured.
    # Missing credentials never produce a fake successful deployment.
    if: github.event_name == 'pull_request' && vars.ENABLE_VERCEL_PREVIEW == 'true'
    steps:
      - name: Validate preview credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [[ -z "$VERCEL_TOKEN" || -z "$VERCEL_ORG_ID" || -z "$VERCEL_PROJECT_ID" ]]; then
            echo "::error::Preview requires VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID for the existing Vercel project. No deployment was attempted."
            exit 1
          fi
      - uses: actions/checkout@v5
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          github-comment: false
          github-deployment: false


  education-contract:
    name: Validate education contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Test contract validator
        run: node --test scripts/verify-education-contract.test.mjs
      - name: Validate project ledger
        run: node scripts/verify-education-contract.mjs

version: '3.8'

services:
  # ════════ PostgreSQL ════════
  postgres:
    image: postgres:16-alpine
    container_name: ma-postgres
    environment:
      POSTGRES_USER: manos
      POSTGRES_PASSWORD: abiertas_dev
      POSTGRES_DB: manosabiertas
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manos"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════ Redis ════════
  redis:
    image: redis:7-alpine
    container_name: ma-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ════════ Kafka ════════
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: ma-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: ma-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"

  # ════════ API Gateway (Kong - opcional) ════════
  # Descomentar si necesitas API Gateway
  # kong:
  #   image: kong:3.4-alpine
  #   container_name: ma-kong
  #   environment:
  #     KONG_DATABASE: postgres
  #     KONG_PG_HOST: postgres
  #     KONG_PROXY_LISTEN: 0.0.0.0:8000
  #   depends_on:
  #     - postgres
  #   ports:
  #     - "8000:8000"
  #     - "8001:8001"

volumes:
  postgres_data:

networks:
  default:
    name: manosabiertas-network
